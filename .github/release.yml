changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, fix]
    - title: Coding tool support
      labels: [harness]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
