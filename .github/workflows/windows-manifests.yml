# SPDX-License-Identifier: Apache-2.0
name: windows-manifests
on:
  pull_request:
    paths:
      - '.goreleaser.yaml'
      - 'scripts/test-scoop.ps1'
  workflow_dispatch:
    inputs:
      corrupt_hash:
        description: 'Genuine-red check: corrupt the amd64 Scoop manifest hash so scoop install must fail'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows-manifests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=sign,notarize,publish

      - name: actionlint
        shell: pwsh
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/windows-manifests.yml

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery

      - name: Lint scripts/test-scoop.ps1
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path scripts/test-scoop.ps1 -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize
            throw "PSScriptAnalyzer reported $($results.Count) warning(s)/error(s)"
          }

      - name: Test Scoop manifest install
        shell: pwsh
        env:
          CORRUPT_HASH: ${{ github.event.inputs.corrupt_hash || 'false' }}
        run: |
          $manifest = (Get-ChildItem -Path dist/scoop -Recurse -Filter ajent.json | Select-Object -First 1).FullName
          if (-not $manifest) {
            throw "rendered Scoop manifest not found under dist/scoop"
          }
          $corrupt = $env:CORRUPT_HASH -eq 'true'
          ./scripts/test-scoop.ps1 -Manifest $manifest -DistDir dist -CorruptHash:$corrupt

      - name: Ensure winget is present
        shell: pwsh
        run: |
          # The runner image may ship a validator older than GoReleaser's schema.
          # Update the validator; keep warnings fatal rather than weakening checks.
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Microsoft.WinGet.Client -Force -Scope CurrentUser -Repository PSGallery
          Repair-WinGetPackageManager -Latest -Force
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Write-Warning "winget could not be installed on this runner; failing the job rather than skipping validation"
            throw "winget is required for manifest validation and is unavailable"
          }

          winget --version

      - name: winget validate
        shell: pwsh
        run: |
          $manifestDir = (Get-ChildItem -Path dist/winget/manifests -Recurse -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'AjentSocial.Ajent.yaml') } |
            Select-Object -First 1).FullName
          if (-not $manifestDir) {
            throw "rendered winget manifest directory not found under dist/winget"
          }
          winget validate --manifest $manifestDir
