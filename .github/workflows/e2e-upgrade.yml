# SPDX-License-Identifier: Apache-2.0
name: e2e-upgrade

# Black-box end-to-end coverage of the self-update path
# (docs/adr/005-upgrade-strategy.md, docs/tasks/T6.8.md): TestUpgrade builds
# three real ajent binaries, installs one as an isolated script install
# under a temporary HOME, and drives it against a local fakerelease server
# to prove the detached auto-update, the post-upgrade integration sync, a
# tampered release being refused and the AJENT_AUTO_UPDATE=0 opt-out.
on:
  pull_request:
    paths:
      - "internal/update/**"
      - "cmd/ajent/**"
      - "internal/integrations/**"
      - "test/e2e/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.9'

      - name: go test -tags e2e (TestUpgrade)
        shell: bash
        run: go test -tags e2e ./test/e2e -run TestUpgrade -count=1 -timeout 10m -v
